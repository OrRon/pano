<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 104" width="160" height="104" role="img" aria-label="pano mascot: a rounded rectangle with two eyes, blinking">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C44CE6"/>
      <stop offset="1" stop-color="#6C8DF2"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="156" height="100" rx="24" fill="url(#g)"/>
  <g fill="#fff">
    <!-- glance left, then right, roughly every 9 s -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 0;-9 0;-9 0;0 0;0 0;9 0;9 0;0 0"
      keyTimes="0;0.22;0.25;0.36;0.39;0.62;0.65;0.76;0.79"
      dur="9s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="52" rx="10" ry="10">
      <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="102" cy="52" rx="10" ry="10">
      <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
